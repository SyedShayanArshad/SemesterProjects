<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Website Privacy Audit Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen flex flex-col">
    <div class="container mx-auto px-4 py-8 max-w-3xl flex-grow">
        <!-- Header -->
        <header class="bg-white shadow-md rounded-lg p-6 mb-8 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Privacy Audit Tool Logo" class="h-10">
                <h1 class="text-2xl font-semibold text-gray-800">Website Privacy Audit Tool</h1>
            </div>
            <a href="{{ url_for('index') }}" class="text-blue-600 hover:text-blue-800 transition flex items-center space-x-2">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
        </header>

        <!-- Main Error Section -->
        <main class="bg-white shadow-lg rounded-lg p-8 text-center">
            <div class="text-6xl text-red-500 mb-4 animate-pulse">⚠️</div>
            <h2 class="text-3xl font-bold text-gray-800 mb-4">Oops! Something Went Wrong</h2>
            <p class="text-lg text-gray-600 mb-6">{{ error }}</p>
            <a href="{{ url_for('index') }}" class="inline-block bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold px-6 py-3 rounded-md hover:from-blue-700 hover:to-indigo-700 transition transform hover:scale-105">
                Try Again
            </a>
        </main>

        <!-- Footer -->
        <footer class="bg-white shadow-md rounded-lg p-6 mt-8 text-center">
            <p class="text-sm text-gray-600">© 2025 Information Security Semester Project</p>
        </footer>
    </div>
</body>
</html>
